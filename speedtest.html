<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>带宽精确诊断</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"PingFang SC",sans-serif;background:#f2f4f7;color:#1a1a1a;padding:16px;font-size:14px}
h1{font-size:19px;margin-bottom:4px}
.sub{font-size:12.5px;color:#7a8a99;margin-bottom:16px;line-height:1.6}
.card{background:#fff;border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.card h2{font-size:14px;color:#1f4e79;margin-bottom:10px;font-weight:600}
.row{display:flex;justify-content:space-between;padding:6px 0;font-size:13px;border-bottom:1px solid #f0f1f3}
.row:last-child{border-bottom:none}
.k{color:#666}.v{font-weight:600;font-variant-numeric:tabular-nums}
button{width:100%;padding:13px;border:none;border-radius:10px;background:#2c5f8e;color:#fff;font-size:15px;font-family:inherit;cursor:pointer;margin-bottom:10px}
button:disabled{opacity:.5}
#log{font-size:11.5px;line-height:1.8;color:#555;white-space:pre-wrap;font-family:ui-monospace,monospace;max-height:340px;overflow-y:auto}
.ok{color:#1a9c50}.bad{color:#d33}.warn{color:#d97706}
</style>
</head>
<body>
<h1>带宽精确诊断</h1>
<div class="sub">判断你的网络是"单连接限速"还是"总带宽限速"。点击下方按钮开始。</div>

<button id="run">开始诊断（约需 1-3 分钟）</button>

<div class="card">
  <h2>A. 单连接测试（下载 1 个 588 KB 文件）</h2>
  <div class="row"><span class="k">耗时</span><span class="v" id="a-time">-</span></div>
  <div class="row"><span class="k">速度</span><span class="v" id="a-speed">-</span></div>
</div>

<div class="card">
  <h2>B. 多连接测试（同时下载 8 个文件）</h2>
  <div class="row"><span class="k">总数据量</span><span class="v" id="b-size">-</span></div>
  <div class="row"><span class="k">耗时</span><span class="v" id="b-time">-</span></div>
  <div class="row"><span class="k">总速度</span><span class="v" id="b-speed">-</span></div>
</div>

<div class="card">
  <h2>C. 结论</h2>
  <div class="row"><span class="k">并行加速比</span><span class="v" id="c-ratio">-</span></div>
  <div class="row"><span class="k">判定</span><span class="v" id="c-judge">-</span></div>
</div>

<div class="card">
  <h2>详细日志</h2>
  <div id="log">等待开始…</div>
</div>

<script>
var FILES = ['e1.js','e2.js','e3.js','e4.js','e5.js','e6.js','e7.js','e8.js'];
var BASE = '';
var logEl = document.getElementById('log');
function log(s){ logEl.textContent += s + '\n'; logEl.scrollTop = logEl.scrollHeight; }
function $(id){ return document.getElementById(id); }
function fmtKB(b){ return (b/1024).toFixed(1) + ' KB'; }
function fmtSpd(bps){ return (bps/1024).toFixed(1) + ' KB/s'; }

/* 下载一个文件，返回 {bytes, ms} */
function dl(file){
  var t0 = performance.now();
  return fetch(BASE + file + '?t=' + Date.now(), {cache:'no-store'})
    .then(function(r){
      if (!r.ok) throw new Error('HTTP ' + r.status);
      var reader = r.body.getReader();
      var total = 0;
      return (function pump(){
        return reader.read().then(function(x){
          if (x.done) return {bytes: total, ms: performance.now() - t0};
          total += x.value.length;
          return pump();
        });
      })();
    });
}

$('run').onclick = function(){
  var btn = this;
  btn.disabled = true;
  logEl.textContent = '';
  $('a-time').textContent = $('a-speed').textContent = '-';
  $('b-size').textContent = $('b-time').textContent = $('b-speed').textContent = '-';
  $('c-ratio').textContent = $('c-judge').textContent = '-';

  var aBytes = 0, aMs = 0;

  /* ---- A: 单连接 ---- */
  log('【A】单连接测试开始…');
  dl(FILES[0]).then(function(r){
    aBytes = r.bytes; aMs = r.ms;
    var spd = aBytes / (aMs/1000);
    $('a-time').textContent = (aMs/1000).toFixed(2) + ' 秒';
    $('a-speed').textContent = fmtSpd(spd);
    log('  单连接: ' + fmtKB(aBytes) + ' / ' + (aMs/1000).toFixed(2) + 's = ' + fmtSpd(spd));

    /* ---- B: 8 连接并发 ---- */
    log('');
    log('【B】8 连接并发测试开始…');
    var t0 = performance.now();
    var starts = [];
    var proms = [];
    for (var i = 0; i < 8; i++){ starts.push(performance.now()); proms.push(dl(FILES[i])); }
    Promise.all(proms).then(function(rs){
      var totalMs = performance.now() - t0;
      var totalBytes = 0;
      for (var i=0;i<rs.length;i++) totalBytes += rs[i].bytes;
      var spd = totalBytes / (totalMs/1000);
      $('b-size').textContent = fmtKB(totalBytes);
      $('b-time').textContent = (totalMs/1000).toFixed(2) + ' 秒';
      $('b-speed').textContent = fmtSpd(spd);
      log('  并发总: ' + fmtKB(totalBytes) + ' / ' + (totalMs/1000).toFixed(2) + 's = ' + fmtSpd(spd));
      rs.forEach(function(r,i){
        log('    块' + (i+1) + ': ' + fmtKB(r.bytes) + ' / ' + (r.ms/1000).toFixed(2) + 's');
      });

      /* ---- C: 结论 ---- */
      var singleSpd = aBytes / (aMs/1000);
      var ratio = spd / singleSpd;
      $('c-ratio').textContent = ratio.toFixed(2) + ' 倍';
      var judge;
      if (ratio > 2.5){
        judge = '✅ 多连接有效！限制是单连接，分块+多域名可提速';
        $('c-judge').className = 'v ok';
      } else if (ratio > 1.3){
        judge = '⚠️ 多连接略有帮助，但总带宽接近上限';
        $('c-judge').className = 'v warn';
      } else {
        judge = '❌ 总带宽受限，分块无效。必须换托管或减小数据';
        $('c-judge').className = 'v bad';
      }
      $('c-judge').textContent = judge;
      log('');
      log('【结论】并行加速比 ' + ratio.toFixed(2) + 'x');
      log('  单连接 ' + fmtSpd(singleSpd) + ' → 8 并发 ' + fmtSpd(spd));
      log('  ' + judge);

      /* 推算全量 6.5MB 需要多久 */
      var fullSec = 6.5 * 1024 * 1024 / spd;
      log('');
      log('【推算】6.5 MB 全量数据在当前条件下需要 ' + fullSec.toFixed(1) + ' 秒');
      if (fullSec <= 3) log('  ✅ 能达到 3 秒目标');
      else log('  ❌ 距离 3 秒目标差 ' + (fullSec/3).toFixed(1) + ' 倍');

      btn.disabled = false;
    }).catch(function(e){
      log('【B】失败: ' + e.message);
      btn.disabled = false;
    });
  }).catch(function(e){
    log('【A】失败: ' + e.message);
    btn.disabled = false;
  });
};
</script>
</body>
</html>
