<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>排行榜</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;position:fixed;width:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:#f2f4f7;color:#1a1a1a;font-size:14px}
#app{height:100%;display:flex;flex-direction:column;max-width:720px;margin:0 auto;background:#fff}

.search{flex:0 0 auto;padding:10px 12px;background:#fff;border-bottom:1px solid #e8eaed;display:flex;gap:8px;align-items:center}
.search input{flex:1;height:38px;padding:0 12px;border:1px solid #dcdfe4;border-radius:8px;font-size:15px;outline:none;background:#f7f8fa;font-family:inherit;min-width:0}
.search input:focus{border-color:#2c5f8e;background:#fff}
.search .clear{flex:0 0 auto;width:38px;height:38px;border:none;background:#f7f8fa;border-radius:8px;font-size:16px;color:#888;cursor:pointer;display:none;line-height:1}
.search .clear.on{display:block}

.bar{flex:0 0 auto;padding:5px 14px;font-size:12px;color:#888;background:#fafbfc;border-bottom:1px solid #eee;display:flex;align-items:center;justify-content:space-between;gap:10px}
.bar b{color:#2c5f8e}
.sorts{display:flex;gap:4px;flex:0 0 auto}
.sorts button{border:1px solid #dcdfe4;background:#fff;color:#666;font-size:12px;padding:3px 9px;border-radius:12px;cursor:pointer;font-family:inherit;line-height:1.4;white-space:nowrap}
.sorts button.on{background:#2c5f8e;border-color:#2c5f8e;color:#fff;font-weight:500}

.list{flex:1 1 auto;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;position:relative}
.spacer{position:relative;width:100%}
.win{position:absolute;left:0;right:0;top:0;will-change:transform}

.row{height:60px;display:flex;align-items:center;padding:0 12px;border-bottom:1px solid #f0f1f3;cursor:pointer;gap:10px}
.row:active{background:#f0f5fa}
.rk{flex:0 0 auto;width:44px;text-align:center;font-weight:700;font-size:13px;color:#9aa0a6;font-variant-numeric:tabular-nums}
.row.top1 .rk{color:#c07a00}
.row.top2 .rk,.row.top3 .rk{color:#8a7000}
.row.pin .rk{color:#c00060}
.mid{flex:1 1 auto;min-width:0}
.nm{font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3}
.sub{font-size:12px;color:#9aa0a6;margin-top:2px;display:flex;gap:8px;align-items:center;white-space:nowrap;overflow:hidden}
.sub .uid{overflow:hidden;text-overflow:ellipsis}
.fan{flex:0 0 auto;text-align:right;font-weight:600;font-size:14px;color:#2c5f8e;font-variant-numeric:tabular-nums;min-width:66px}
.fan span{display:block;font-size:11px;font-weight:400;color:#9aa0a6}

.empty{display:flex;align-items:center;justify-content:center;height:100%;color:#9aa0a6;font-size:14px}

.mask{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.mask.on{display:flex}
.modal{background:#fff;border-radius:14px;width:100%;max-width:400px;max-height:86vh;overflow:hidden;display:flex;flex-direction:column}
.mh{padding:14px 16px;border-bottom:1px solid #eee;position:relative;padding-right:44px}
.mclose{position:absolute;right:10px;top:10px;width:28px;height:28px;border:none;background:#f2f4f7;border-radius:50%;font-size:15px;color:#888;cursor:pointer;line-height:1}
.muser .nm{font-size:17px;font-weight:600;line-height:1.3;word-break:break-all;white-space:normal}
.muser .uid{font-size:12px;color:#9aa0a6;margin-top:3px}
.ms{display:flex;border-top:1px solid #f0f1f3;border-bottom:1px solid #f0f1f3}
.ms div{flex:1;text-align:center;padding:9px 0;border-right:1px solid #f0f1f3}
.ms div:last-child{border-right:none}
.ms .v{font-size:16px;font-weight:700;color:#2c5f8e;font-variant-numeric:tabular-nums}
.ms .k{font-size:11px;color:#9aa0a6;margin-top:1px}
.mb{overflow-y:auto;position:relative}
.grp{padding:7px 16px 5px;font-size:11px;color:#9aa0a6;background:#fafbfc;font-weight:500;position:sticky;top:0;z-index:1}
.mrow{display:flex;align-items:center;padding:7px 16px;gap:8px;cursor:pointer;border-bottom:1px solid #f7f8fa;height:46px}
.mrow:active{background:#f0f5fa}
.mrow.self{background:#fff9e6;border-left:3px solid #f0b400;padding-left:13px}
.mrow .rk{width:38px;font-size:12px}
.mrow .nm{font-size:13px;font-weight:400}
.mrow .fan{font-size:12px;min-width:60px}
</style>
</head>
<body>
<div id="app">
  <div class="search">
    <input id="q" type="search" placeholder="搜索昵称或用户ID" autocomplete="off" autocorrect="off" spellcheck="false">
    <button class="clear" id="clr">✕</button>
  </div>
  <div class="bar">
    <span id="bar"></span>
    <div class="sorts">
      <button data-sort="fan" class="on">粉丝</button>
      <button data-sort="level">等级</button>
      <button data-sort="id">ID</button>
    </div>
  </div>
  <div class="list" id="list">
    <div class="spacer" id="spacer"><div class="win" id="win"></div></div>
  </div>
</div>

<div class="mask" id="mask">
  <div class="modal">
    <div class="mh">
      <button class="mclose" id="mclose">✕</button>
      <div class="muser" id="muser"></div>
    </div>
    <div class="ms" id="mstats"></div>
    <div class="mb" id="mbody"></div>
  </div>
</div>

<script src="users.js"></script>
<script>
(function(){
  var DATA = window.__USERS__ || [];
  var ROW_H = 60;
  var OVERSCAN = 12;

  var listEl = document.getElementById('list');
  var spacerEl = document.getElementById('spacer');
  var winEl = document.getElementById('win');
  var barEl = document.getElementById('bar');
  var qEl = document.getElementById('q');
  var clrEl = document.getElementById('clr');
  var maskEl = document.getElementById('mask');
  var mbodyEl = document.getElementById('mbody');

  var view = [];       // 当前结果集
  var renderedFrom = -1, renderedTo = -1;

  function fmt(n){ return n.toLocaleString('en-US'); }
  function esc(s){ return String(s||'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }

  function rowHTML(u, pos){
    var cls = 'row';
    if (sortMode === 'fan'){
      if (pos===1) cls+=' top1';
      else if (pos<=3) cls+=' top2';
      else if (pos<=10) cls+=' top3';
    }
    if (u[7]) cls+=' pin';
    return '<div class="'+cls+'" data-i="'+u[0]+'">'
      + '<div class="rk">'+pos+'</div>'
      + '<div class="mid"><div class="nm">'+esc(u[2])+'</div>'
      + '<div class="sub"><span>Lv.'+u[6]+'</span><span class="uid">'+esc(u[1])+'</span></div></div>'
      + '<div class="fan">'+fmt(u[3])+'<span>粉丝</span></div></div>';
  }

  function paint(force){
    if (!view.length){
      renderedFrom = renderedTo = -1;
      winEl.innerHTML = '';
      return;
    }
    var st = listEl.scrollTop;
    var h = listEl.clientHeight;
    var start = Math.max(0, Math.floor(st / ROW_H) - OVERSCAN);
    var end = Math.min(view.length, Math.ceil((st + h) / ROW_H) + OVERSCAN);

    if (!force && start === renderedFrom && end === renderedTo) return;

    renderedFrom = start;
    renderedTo = end;
    winEl.style.transform = 'translateY(' + (start * ROW_H) + 'px)';

    var parts = [];
    for (var i = start; i < end; i++) parts.push(rowHTML(view[i], i + 1));
    winEl.innerHTML = parts.join('');
  }

  function setView(items){
    view = items;
    spacerEl.style.height = (items.length * ROW_H) + 'px';
    listEl.scrollTop = 0;
    renderedFrom = renderedTo = -1;
    if (!items.length){
      winEl.innerHTML = '';
    } else {
      paint(true);
    }
  }

  var sortMode = 'fan';

  function applySort(items){
    if (sortMode === 'fan'){
      return items.sort(function(a,b){ return a[3] !== b[3] ? b[3]-a[3] : a[0]-b[0]; });
    } else if (sortMode === 'level'){
      return items.sort(function(a,b){
        if (a[6] !== b[6]) return b[6]-a[6];
        if (a[3] !== b[3]) return b[3]-a[3];
        return a[0]-b[0];
      });
    } else {
      return items.sort(function(a,b){
        var x = parseInt(a[1],10), y = parseInt(b[1],10);
        return x !== y ? x-y : a[0]-b[0];
      });
    }
  }

  function doSearch(){
    var kw = qEl.value.trim().toLowerCase();
    clrEl.className = kw ? 'clear on' : 'clear';
    var items;
    if (!kw){
      items = DATA.slice();
      items = applySort(items);
      barEl.innerHTML = '共 <b>' + DATA.length + '</b> 个账号 · 按' +
        (sortMode==='fan'?'粉丝':sortMode==='level'?'等级':'ID') + '排序';
    } else {
      items = [];
      for (var i = 0; i < DATA.length; i++){
        var u = DATA[i];
        if (u[2].toLowerCase().indexOf(kw) > -1 || u[1].indexOf(kw) > -1) items.push(u);
      }
      items = applySort(items);
      barEl.innerHTML = '匹配 <b>' + items.length + '</b> 个账号 · 按' +
        (sortMode==='fan'?'粉丝':sortMode==='level'?'等级':'ID') + '排序';
    }
    if (!items.length){
      barEl.innerHTML += ' <span style="color:#bbb">（无结果）</span>';
    }
    setView(items);
  }

  function openDetail(u){
    document.getElementById('muser').innerHTML =
      '<div class="nm">' + esc(u[2]) + '</div><div class="uid">ID: ' + esc(u[1]) + '</div>';

    document.getElementById('mstats').innerHTML =
      '<div><div class="v">#' + u[0] + '</div><div class="k">排名</div></div>'
      + '<div><div class="v">' + fmt(u[3]) + '</div><div class="k">粉丝</div></div>'
      + '<div><div class="v">' + fmt(u[4]) + '</div><div class="k">关注</div></div>'
      + '<div><div class="v">' + u[6] + '</div><div class="k">等级</div></div>';

    var idx = u[0] - 1;
    var from = Math.max(0, idx - 10);
    var to = Math.min(DATA.length, idx + 11);
    var html = '<div class="grp">排名相近</div>';
    for (var i = from; i < to; i++){
      var x = DATA[i];
      var isSelf = (x[0] === u[0]);
      html += '<div class="mrow' + (isSelf ? ' self' : '') + '" data-i="' + x[0] + '">'
        + '<div class="rk">' + x[0] + '</div>'
        + '<div class="mid"><div class="nm">' + esc(x[2]) + '</div></div>'
        + '<div class="fan">' + fmt(x[3]) + '</div></div>';
    }
    mbodyEl.innerHTML = html;
    maskEl.classList.add('on');

    mbodyEl.scrollTop = 0;
    setTimeout(function(){
      var selfEl = mbodyEl.querySelector('.mrow.self');
      if (selfEl){
        var box = selfEl.offsetTop - mbodyEl.clientHeight / 2 + selfEl.offsetHeight / 2;
        mbodyEl.scrollTop = Math.max(0, box);
      }
    }, 20);
  }

  var sortBtns = document.querySelectorAll('.sorts button');
  for (var si = 0; si < sortBtns.length; si++){
    (function(btn){
      btn.addEventListener('click', function(){
        for (var k = 0; k < sortBtns.length; k++) sortBtns[k].className = '';
        btn.className = 'on';
        sortMode = btn.getAttribute('data-sort');
        doSearch();
      });
    })(sortBtns[si]);
  }

  listEl.addEventListener('scroll', function(){ paint(false); }, { passive: true });
  window.addEventListener('resize', function(){ paint(true); });

  qEl.addEventListener('input', doSearch);
  clrEl.addEventListener('click', function(){ qEl.value = ''; doSearch(); qEl.focus(); });

  listEl.addEventListener('click', function(e){
    var row = e.target.closest('.row');
    if (!row) return;
    var i = parseInt(row.getAttribute('data-i'), 10);
    openDetail(DATA[i - 1]);
  });

  mbodyEl.addEventListener('click', function(e){
    var row = e.target.closest('.mrow');
    if (!row) return;
    var i = parseInt(row.getAttribute('data-i'), 10);
    openDetail(DATA[i - 1]);
  });

  document.getElementById('mclose').addEventListener('click', function(){ maskEl.classList.remove('on'); });
  maskEl.addEventListener('click', function(e){ if (e.target === maskEl) maskEl.classList.remove('on'); });
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape') maskEl.classList.remove('on'); });

  doSearch();
})();
</script>
</body>
</html>
