<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>小黑盒粉丝排行榜</title>
<!-- Microsoft Clarity -->
<script type="text/javascript">
    (function(c,l,a,r,i,t,y){
        c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
        t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
        y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
    })(window, document, "clarity", "script", "z5a0szp3nj");
</script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;position:fixed;width:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:#f2f4f7;color:#1a1a1a;font-size:14px}
#app{height:100%;display:flex;flex-direction:column;max-width:720px;margin:0 auto;background:#fff}

.search{flex:0 0 auto;padding:10px 12px 8px;background:#fff;display:flex;gap:8px;align-items:center}
.search input{flex:1;height:38px;padding:0 12px;border:1px solid #dcdfe4;border-radius:8px;font-size:15px;outline:none;background:#f7f8fa;font-family:inherit;min-width:0}
.search input:focus{border-color:#2c5f8e;background:#fff}
.search .clear{flex:0 0 auto;width:38px;height:38px;border:none;background:#f7f8fa;border-radius:8px;font-size:16px;color:#888;cursor:pointer;display:none;line-height:1}
.search .clear.on{display:block}

.sorts{flex:0 0 auto;padding:0 12px 8px;background:#fff;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.sorts::-webkit-scrollbar{display:none}
.sorts button{flex:0 0 auto;border:1px solid #dcdfe4;background:#fff;color:#666;font-size:12.5px;padding:5px 13px;border-radius:15px;cursor:pointer;font-family:inherit;line-height:1.4;white-space:nowrap;transition:all .15s}
.sorts button.on{background:#2c5f8e;border-color:#2c5f8e;color:#fff;font-weight:500}

.bar{flex:0 0 auto;padding:6px 14px;font-size:12px;color:#888;background:#fafbfc;border-top:1px solid #f0f1f3;border-bottom:1px solid #e8eaed}
.bar b{color:#2c5f8e}

.list{flex:1 1 auto;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;position:relative}
.spacer{position:relative;width:100%}
.win{position:absolute;left:0;right:0;top:0;will-change:transform}

.row{height:76px;display:flex;align-items:center;padding:0 12px;border-bottom:1px solid #f0f1f3;cursor:pointer;gap:10px}
.row:active{background:#f0f5fa}
.rk{flex:0 0 auto;width:42px;text-align:center;font-weight:700;font-size:13px;color:#9aa0a6;font-variant-numeric:tabular-nums}
.row.top1 .rk{color:#c07a00}
.row.top2 .rk,.row.top3 .rk{color:#8a7000}
.row.pin .rk{color:#c00060}
.mid{flex:1 1 auto;min-width:0}
.nm{font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3}
.stats{font-size:11.5px;color:#9aa0a6;margin-top:3px;display:flex;gap:9px;white-space:nowrap;overflow:hidden}
.stats span{flex:0 0 auto}
.tag{display:inline-block;padding:0 5px;border-radius:3px;font-size:10.5px;line-height:14px;font-weight:500;background:#fce4ef;color:#c00060}
.fan{flex:0 0 auto;text-align:right;font-weight:600;font-size:14px;color:#2c5f8e;font-variant-numeric:tabular-nums;min-width:66px}
.fan span{display:block;font-size:11px;font-weight:400;color:#9aa0a6}

.empty{display:flex;align-items:center;justify-content:center;height:100%;color:#9aa0a6;font-size:14px}

.mask{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.mask.on{display:flex}
.modal{background:#fff;border-radius:14px;width:100%;max-width:400px;max-height:86vh;overflow:hidden;display:flex;flex-direction:column;position:relative}
.mh{padding:14px 16px;border-bottom:1px solid #eee;position:relative;padding-right:44px}
.mclose{position:absolute;right:10px;top:10px;width:28px;height:28px;border:none;background:#f2f4f7;border-radius:50%;font-size:15px;color:#888;cursor:pointer;line-height:1}
.muser .nm{font-size:17px;font-weight:600;line-height:1.3;word-break:break-all;white-space:normal}
.muser .uid{font-size:12px;color:#9aa0a6;margin-top:3px}
.ms{display:flex;border-top:1px solid #f0f1f3;border-bottom:1px solid #f0f1f3}
.ms div{flex:1;text-align:center;padding:8px 0;border-right:1px solid #f0f1f3}
.ms div:last-child{border-right:none}
.ms .v{font-size:15px;font-weight:700;color:#2c5f8e;font-variant-numeric:tabular-nums}
.ms .k{font-size:10.5px;color:#9aa0a6;margin-top:1px}
.mb{overflow-y:auto;flex:1}
.grp{padding:7px 16px 5px;font-size:11px;color:#9aa0a6;background:#fafbfc;font-weight:500;position:sticky;top:0;z-index:1}
.mrow{display:flex;align-items:center;padding:7px 16px;gap:8px;cursor:pointer;border-bottom:1px solid #f7f8fa;height:46px}
.mrow:active{background:#f0f5fa}
.mrow.self{background:#fff9e6;border-left:3px solid #f0b400;padding-left:13px}
.mrow .rk{width:38px;font-size:12px}
.mrow .nm{font-size:13px;font-weight:400}
.mrow .fan{font-size:12px;min-width:60px}
.mfoot{flex:0 0 auto;padding:10px 16px;border-top:1px solid #f0f1f3;display:flex;gap:10px}
.btn{flex:1;height:38px;border:none;border-radius:9px;font-size:14px;font-weight:500;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:5px}
.btn-primary{background:#2c5f8e;color:#fff}
.btn-primary:active{background:#244c72}
.btn-ghost{background:#f2f4f7;color:#555}

/* 保存卡片（离屏渲染，不显示保存按钮） */
#cardWrap{position:fixed;left:-9999px;top:0;z-index:-1}
</style>
</head>
<body>
<div id="app">
  <div class="search">
    <input id="q" type="search" placeholder="搜索昵称或用户ID" autocomplete="off" autocorrect="off" spellcheck="false">
    <button class="clear" id="clr">✕</button>
  </div>
  <div class="sorts" id="sorts">
    <button data-sort="fan" class="on">粉丝</button>
    <button data-sort="post">发帖</button>
    <button data-sort="follow">关注</button>
    <button data-sort="award">点赞收藏</button>
    <button data-sort="level">等级</button>
    <button data-sort="id">ID</button>
  </div>
  <div class="bar" id="bar"></div>
  <div class="list" id="list">
    <div class="spacer" id="spacer"><div class="win" id="win"></div></div>
  </div>
</div>

<div class="mask" id="mask">
  <div class="modal">
    <div class="mh">
      <button class="mclose" id="mclose">✕</button>
      <div class="muser" id="muser"></div>
    </div>
    <div class="ms" id="mstats"></div>
    <div class="mb" id="mbody"></div>
    <div class="mfoot">
      <button class="btn btn-primary" id="saveBtn">保存卡片</button>
    </div>
  </div>
</div>

<div id="cardWrap"></div>

<script src="users.js"></script>
<script>
(function(){
  var DATA = window.__USERS__ || [];
  var ROW_H = 76;
  var OVERSCAN = 12;
  var sortMode = 'fan';
  var curUser = null;

  var listEl = document.getElementById('list');
  var spacerEl = document.getElementById('spacer');
  var winEl = document.getElementById('win');
  var barEl = document.getElementById('bar');
  var qEl = document.getElementById('q');
  var clrEl = document.getElementById('clr');
  var maskEl = document.getElementById('mask');
  var mbodyEl = document.getElementById('mbody');

  var view = [];
  var renderedFrom = -1, renderedTo = -1;

  function fmt(n){ return (n||0).toLocaleString('en-US'); }
  function esc(s){ return String(s||'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }

  var SORT_LABEL = {fan:'粉丝', post:'发帖', follow:'关注', award:'点赞收藏', level:'等级', id:'ID'};
  var SORT_IDX = {fan:3, post:5, follow:4, award:7, level:6, id:1};

  function applySort(arr){
    var key = SORT_IDX[sortMode];
    return arr.sort(function(a,b){
      if (sortMode === 'id'){
        var x = parseInt(a[1],10), y = parseInt(b[1],10);
        return x !== y ? x - y : a[0] - b[0];
      }
      if (a[key] !== b[key]) return b[key] - a[key];
      if (a[3] !== b[3]) return b[3] - a[3];
      return a[0] - b[0];
    });
  }

  function rowHTML(u){
    var cls = 'row';
    if (u[0]===1) cls+=' top1';
    else if (u[0]<=3) cls+=' top2';
    else if (u[0]<=10) cls+=' top3';
    if (u[8]) cls+=' pin';
    var tg = u[8] ? '<span class="tag">个人</span>' : '';
    return '<div class="'+cls+'" data-i="'+u[0]+'">'
      + '<div class="rk">'+u[0]+'</div>'
      + '<div class="mid"><div class="nm">'+tg+esc(u[2])+'</div>'
      + '<div class="stats"><span>发帖 '+fmt(u[5])+'</span><span>关注 '+fmt(u[4])+'</span><span>点赞收藏 '+fmt(u[7])+'</span></div></div>'
      + '<div class="fan">'+fmt(u[3])+'<span>粉丝</span></div></div>';
  }

  function paint(force){
    if (!view.length){ winEl.innerHTML=''; renderedFrom=renderedTo=-1; return; }
    var st = listEl.scrollTop, h = listEl.clientHeight;
    var start = Math.max(0, Math.floor(st/ROW_H) - OVERSCAN);
    var end = Math.min(view.length, Math.ceil((st+h)/ROW_H) + OVERSCAN);
    if (!force && start===renderedFrom && end===renderedTo) return;
    renderedFrom=start; renderedTo=end;
    winEl.style.transform = 'translateY(' + (start*ROW_H) + 'px)';
    var parts=[];
    for (var i=start;i<end;i++) parts.push(rowHTML(view[i]));
    winEl.innerHTML = parts.join('');
  }

  function setView(items){
    view = items;
    spacerEl.style.height = (items.length*ROW_H) + 'px';
    listEl.scrollTop = 0;
    renderedFrom = renderedTo = -1;
    if (items.length) paint(true); else winEl.innerHTML='';
  }

  function doSearch(){
    var kw = qEl.value.trim().toLowerCase();
    clrEl.className = kw ? 'clear on' : 'clear';
    var items;
    if (!kw){
      items = DATA.slice();
      items = applySort(items);
      barEl.innerHTML = '共 <b>' + fmt(DATA.length) + '</b> 个账号 · 按' + SORT_LABEL[sortMode] + '排序';
    } else {
      items = [];
      for (var i=0;i<DATA.length;i++){
        var u = DATA[i];
        if (u[2].toLowerCase().indexOf(kw) > -1 || u[1].indexOf(kw) > -1) items.push(u);
      }
      items = applySort(items);
      barEl.innerHTML = '匹配 <b>' + fmt(items.length) + '</b> 个账号 · 按' + SORT_LABEL[sortMode] + '排序';
    }
    setView(items);
  }

  function openDetail(u){
    curUser = u;
    document.getElementById('muser').innerHTML =
      '<div class="nm">'+esc(u[2])+(u[8]?' <span class="tag" style="font-size:11px">个人</span>':'')+'</div>'
      + '<div class="uid">ID: '+esc(u[1])+'</div>';

    document.getElementById('mstats').innerHTML =
      '<div><div class="v">#'+u[0]+'</div><div class="k">排名</div></div>'
      + '<div><div class="v">'+fmt(u[3])+'</div><div class="k">粉丝</div></div>'
      + '<div><div class="v">'+fmt(u[4])+'</div><div class="k">关注</div></div>'
      + '<div><div class="v">'+fmt(u[5])+'</div><div class="k">发帖</div></div>'
      + '<div><div class="v">'+fmt(u[7])+'</div><div class="k">点赞收藏</div></div>'
      + '<div><div class="v">Lv.'+u[6]+'</div><div class="k">等级</div></div>';

    var idx = u[0]-1;
    var from = Math.max(0, idx-10), to = Math.min(DATA.length, idx+11);
    var html = '<div class="grp">排名相近</div>';
    for (var i=from;i<to;i++){
      var x = DATA[i], isSelf = (x[0]===u[0]);
      html += '<div class="mrow'+(isSelf?' self':'')+'" data-i="'+x[0]+'">'
        + '<div class="rk">'+x[0]+'</div>'
        + '<div class="mid"><div class="nm">'+esc(x[2])+'</div></div>'
        + '<div class="fan">'+fmt(x[3])+'</div></div>';
    }
    mbodyEl.innerHTML = html;
    maskEl.classList.add('on');
    mbodyEl.scrollTop = 0;
    setTimeout(function(){
      var selfEl = mbodyEl.querySelector('.mrow.self');
      if (selfEl){
        var t = selfEl.offsetTop - mbodyEl.clientHeight/2 + selfEl.offsetHeight/2;
        mbodyEl.scrollTop = Math.max(0, t);
      }
    }, 20);
  }

  /* ===== 生成卡片图片 ===== */
  function buildCard(u, cb){
    var W = 640, H = 400;
    var dpr = 2;
    var cv = document.createElement('canvas');
    cv.width = W*dpr; cv.height = H*dpr;
    var x = cv.getContext('2d');
    x.scale(dpr, dpr);

    // 背景渐变
    var g = x.createLinearGradient(0,0,W,H);
    g.addColorStop(0,'#0f3d5c'); g.addColorStop(1,'#1f4e79');
    x.fillStyle = g; x.fillRect(0,0,W,H);

    // 装饰圆
    x.fillStyle = 'rgba(232,116,59,0.10)';
    x.beginPath(); x.arc(W-50, H+40, 200, 0, Math.PI*2); x.fill();
    x.fillStyle = 'rgba(255,255,255,0.04)';
    x.beginPath(); x.arc(60, -40, 160, 0, Math.PI*2); x.fill();

    // 顶部标签
    x.fillStyle = u[8] ? 'rgba(232,116,59,0.9)' : 'rgba(255,255,255,0.13)';
    roundRect(x, 32, 26, u[8]?86:76, 26, 13); x.fill();
    x.fillStyle = '#fff'; x.font = '13px -apple-system,"PingFang SC","Microsoft YaHei",sans-serif';
    x.textAlign='center'; x.textBaseline='middle';
    x.fillText(u[8] ? '个人账号' : '官方账号', 32+(u[8]?43:38), 40);

    // 排名
    x.textAlign='left'; x.textBaseline='alphabetic';
    x.fillStyle='rgba(255,255,255,0.55)';
    x.font='13px -apple-system,"PingFang SC","Microsoft YaHei",sans-serif';
    x.fillText('全站排名', 32, 92);
    x.fillStyle='#FFD966';
    x.font='bold 46px -apple-system,"PingFang SC","Microsoft YaHei",sans-serif';
    x.fillText('#'+u[0], 32, 140);

    // 昵称
    x.fillStyle='#fff';
    var nm = u[2], fsz = 30;
    x.font = 'bold '+fsz+'px -apple-system,"PingFang SC","Microsoft YaHei",sans-serif';
    while (x.measureText(nm).width > W-64 && fsz > 16){
      fsz -= 2;
      x.font = 'bold '+fsz+'px -apple-system,"PingFang SC","Microsoft YaHei",sans-serif';
    }
    x.fillText(nm, 32, 192);

    // ID
    x.fillStyle='rgba(255,255,255,0.45)';
    x.font='14px -apple-system,"PingFang SC","Microsoft YaHei",sans-serif';
    x.fillText('ID: '+u[1], 32, 218);

    // 四个数据格
    var items = [
      ['粉丝', fmt(u[3])],
      ['关注', fmt(u[4])],
      ['发帖', fmt(u[5])],
      ['点赞收藏', fmt(u[7])],
      ['等级', 'Lv.'+u[6]]
    ];
    var cw = (W-64-4*12)/5, cy = 258, ch = 88;
    for (var i=0;i<items.length;i++){
      var cx = 32 + i*(cw+12);
      x.fillStyle='rgba(255,255,255,0.08)';
      roundRect(x, cx, cy, cw, ch, 10); x.fill();
      x.strokeStyle='rgba(255,255,255,0.14)'; x.lineWidth=1;
      roundRect(x, cx, cy, cw, ch, 10); x.stroke();

      x.textAlign='center';
      x.fillStyle='#FFD966';
      var vf = 17;
      x.font='bold '+vf+'px -apple-system,"PingFang SC","Microsoft YaHei",sans-serif';
      var vt = items[i][1];
      while (x.measureText(vt).width > cw-12 && vf > 10){
        vf -= 1;
        x.font='bold '+vf+'px -apple-system,"PingFang SC","Microsoft YaHei",sans-serif';
      }
      x.fillText(vt, cx+cw/2, cy+38);
      x.fillStyle='rgba(255,255,255,0.55)';
      x.font='11px -apple-system,"PingFang SC","Microsoft YaHei",sans-serif';
      x.fillText(items[i][0], cx+cw/2, cy+62);
      x.textAlign='left';
    }

    // 底部
    var dt = new Date();
    var ds = dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');
    x.fillStyle='rgba(255,255,255,0.35)';
    x.font='11px -apple-system,"PingFang SC","Microsoft YaHei",sans-serif';
    x.fillText('数据截止 '+ds+'  ·  来源：小黑盒公开主页', 32, H-22);
    x.textAlign='right';
    x.fillStyle='rgba(255,255,255,0.28)';
    x.fillText('小黑盒粉丝排行榜', W-32, H-22);

    cb(cv);
  }

  function roundRect(ctx,x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
    ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
    ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
    ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y);
    ctx.closePath();
  }

  function saveCard(){
    if (!curUser) return;
    var btn = document.getElementById('saveBtn');
    var old = btn.textContent;
    btn.textContent = '生成中…'; btn.disabled = true;

    buildCard(curUser, function(cv){
      cv.toBlob(function(blob){
        var name = curUser[2].replace(/[\\/:*?"<>|]/g,'_');
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url; a.download = '小黑盒排名_第'+curUser[0]+'名_'+name+'.png';
        document.body.appendChild(a); a.click();
        document.body.removeChild(a);
        setTimeout(function(){ URL.revokeObjectURL(url); }, 1500);
        btn.disabled = false; btn.textContent = old;
      }, 'image/png');
    });
  }

  // 事件
  listEl.addEventListener('scroll', function(){ paint(false); }, { passive:true });
  window.addEventListener('resize', function(){ paint(true); });

  var sortBtns = document.querySelectorAll('#sorts button');
  for (var si=0; si<sortBtns.length; si++){
    (function(btn){
      btn.addEventListener('click', function(){
        for (var k=0;k<sortBtns.length;k++) sortBtns[k].className='';
        btn.className='on';
        sortMode = btn.getAttribute('data-sort');
        doSearch();
      });
    })(sortBtns[si]);
  }

  qEl.addEventListener('input', doSearch);
  clrEl.addEventListener('click', function(){ qEl.value=''; doSearch(); qEl.focus(); });

  listEl.addEventListener('click', function(e){
    var row = e.target.closest('.row');
    if (!row) return;
    openDetail(DATA[parseInt(row.getAttribute('data-i'),10)-1]);
  });
  mbodyEl.addEventListener('click', function(e){
    var row = e.target.closest('.mrow');
    if (!row) return;
    openDetail(DATA[parseInt(row.getAttribute('data-i'),10)-1]);
  });
  document.getElementById('mclose').addEventListener('click', function(){ maskEl.classList.remove('on'); });
  maskEl.addEventListener('click', function(e){ if (e.target===maskEl) maskEl.classList.remove('on'); });
  document.addEventListener('keydown', function(e){ if (e.key==='Escape') maskEl.classList.remove('on'); });
  document.getElementById('saveBtn').addEventListener('click', saveCard);

  doSearch();
})();
</script>
</body>
</html>
