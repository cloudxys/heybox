<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>小黑盒粉丝排行榜</title>
<!-- Microsoft Clarity -->
<script type="text/javascript">
    (function(c,l,a,r,i,t,y){
        c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
        t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
        y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
    })(window, document, "clarity", "script", "z68ybg3ogi");
</script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;position:fixed;width:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:#f2f4f7;color:#1a1a1a;font-size:14px}
#app{height:100%;display:flex;flex-direction:column;max-width:720px;margin:0 auto;background:#fff}

.search{flex:0 0 auto;padding:10px 12px 8px;background:#fff;display:flex;align-items:center}
.search-wrap{position:relative;flex:1;display:flex;align-items:center}
.search input{flex:1;width:100%;height:38px;padding:0 40px 0 12px;border:1px solid #dcdfe4;border-radius:8px;font-size:15px;outline:none;background:#f7f8fa;font-family:inherit;min-width:0;-webkit-appearance:none;appearance:none}
.search-x{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:26px;height:26px;display:none;align-items:center;justify-content:center;cursor:pointer;border-radius:50%}
.search-x.on{display:flex}
.search-x:active{background:#e8eef3}
.search input::-webkit-search-cancel-button{-webkit-appearance:none;appearance:none;display:none}
.search input:focus{border-color:#2c5f8e;background:#fff}

.sorts{flex:0 0 auto;padding:0 12px 8px;background:#fff;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.sorts::-webkit-scrollbar{display:none}
.sorts button{flex:0 0 auto;border:1px solid #dcdfe4;background:#fff;color:#666;font-size:12.5px;padding:5px 13px;border-radius:15px;cursor:pointer;font-family:inherit;line-height:1.4;white-space:nowrap;transition:all .15s}
.sorts button.on{background:#2c5f8e;border-color:#2c5f8e;color:#fff;font-weight:500}

.bar{flex:0 0 auto;padding:6px 14px;font-size:12px;color:#888;background:#fafbfc;border-top:1px solid #f0f1f3;border-bottom:1px solid #e8eaed}
.bar b{color:#2c5f8e}

.list{flex:1 1 auto;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;position:relative}
.spacer{position:relative;width:100%}
.win{position:absolute;left:0;right:0;top:0;will-change:transform}

.row{height:76px;display:flex;align-items:center;padding:0 12px;border-bottom:1px solid #f0f1f3;cursor:pointer;gap:10px}
.row:active{background:#f0f5fa}
.rk{flex:0 0 auto;width:42px;text-align:center;font-weight:700;font-size:13px;color:#9aa0a6;font-variant-numeric:tabular-nums}
.row.top1 .rk{color:#c07a00}
.row.top2 .rk,.row.top3 .rk{color:#8a7000}
.row.pin .rk{color:#c00060}
.mid{flex:1 1 auto;min-width:0}
.nm{font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3}
.stats{font-size:11.5px;color:#9aa0a6;margin-top:3px;display:flex;gap:9px;white-space:nowrap;overflow:hidden}
.stats span{flex:0 0 auto}
.tag{display:inline-block;padding:0 5px;border-radius:3px;font-size:10.5px;line-height:14px;font-weight:500;background:#fce4ef;color:#c00060}
.fan{flex:0 0 auto;text-align:right;font-weight:600;font-size:14px;color:#2c5f8e;font-variant-numeric:tabular-nums;min-width:66px}
.fan span{display:block;font-size:11px;font-weight:400;color:#9aa0a6}

.empty{display:flex;align-items:center;justify-content:center;height:100%;color:#9aa0a6;font-size:14px}

.mask{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.mask.on{display:flex}
.mfoot{display:flex;gap:8px;padding:10px 12px;border-top:1px solid #f0f1f3;background:#fff}
.mfoot .btn{flex:1;margin:0;font-size:13.5px;padding:10px 8px}
.btn-secondary{background:#f7f8fa;color:#2c5f8e;border:1px solid #d8e0e8}
.btn-secondary:active{background:#eef2f6}
#mstats .hi{background:#eef6f9;border-radius:6px}
.modal{background:#fff;border-radius:14px;width:100%;max-width:400px;max-height:86vh;overflow:hidden;display:flex;flex-direction:column;position:relative}
.mh{padding:14px 16px;border-bottom:1px solid #eee;position:relative;padding-right:44px}
.mclose{position:absolute;right:10px;top:10px;width:28px;height:28px;border:none;background:#f2f4f7;border-radius:50%;font-size:15px;color:#888;cursor:pointer;line-height:1}
.muser .nm{font-size:17px;font-weight:600;line-height:1.3;word-break:break-all;white-space:normal}
.muser .uid{font-size:12px;color:#9aa0a6;margin-top:3px}
.ms{display:flex;border-top:1px solid #f0f1f3;border-bottom:1px solid #f0f1f3}
.ms div{flex:1;text-align:center;padding:8px 0;border-right:1px solid #f0f1f3}
.ms div:last-child{border-right:none}
.ms .v{font-size:15px;font-weight:700;color:#2c5f8e;font-variant-numeric:tabular-nums}
.ms .k{font-size:10.5px;color:#9aa0a6;margin-top:1px}
.mb{overflow-y:auto;flex:1}
.grp{padding:7px 16px 5px;font-size:11px;color:#9aa0a6;background:#fafbfc;font-weight:500;position:sticky;top:0;z-index:1}
.mrow{display:flex;align-items:center;padding:7px 16px;gap:8px;cursor:pointer;border-bottom:1px solid #f7f8fa;height:46px}
.mrow:active{background:#f0f5fa}
.mrow.self{background:#fff9e6;border-left:3px solid #f0b400;padding-left:13px}
.mrow .rk{width:38px;font-size:12px}
.mrow .nm{font-size:13px;font-weight:400}
.mrow .fan{font-size:12px;min-width:60px}
.mfoot{flex:0 0 auto;padding:10px 16px;border-top:1px solid #f0f1f3;display:flex;gap:10px}
.btn{flex:1;height:38px;border:none;border-radius:9px;font-size:14px;font-weight:500;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:5px}
.btn-primary{background:#2c5f8e;color:#fff}
.btn-primary:active{background:#244c72}
.btn-ghost{background:#f2f4f7;color:#555}

/* 保存卡片（离屏渲染，不显示保存按钮） */
#cardWrap{position:fixed;left:-9999px;top:0;z-index:-1}
</style>
</head>
<body>
<div id="app">
  <div class="search">
    <div class="search-wrap">
      <input id="q" type="search" placeholder="搜索昵称或用户ID" autocomplete="off" autocorrect="off" spellcheck="false">
      <span class="search-x" id="clr" aria-label="清除">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#2c5f8e" stroke-width="2.4" stroke-linecap="round"><path d="M6 6L18 18M18 6L6 18"/></svg>
      </span>
    </div>
  </div>
  <div class="sorts" id="sorts">
    <button data-sort="fan" class="on">粉丝</button>
    <button data-sort="award">点赞收藏</button>
    <button data-sort="level">等级</button>
    <button data-sort="id">ID</button>
    <button data-sort="post">发帖</button>
    <button data-sort="follow">关注</button>
  </div>
  <div class="bar" id="bar"></div>
  <div class="list" id="list">
    <div class="spacer" id="spacer"><div class="win" id="win"></div></div>
  </div>
</div>

<div class="mask" id="mask">
  <div class="modal">
    <div class="mh">
      <button class="mclose" id="mclose">✕</button>
      <div class="muser" id="muser"></div>
    </div>
    <div class="ms" id="mstats"></div>
    <div class="mb" id="mbody"></div>
    <div class="mfoot">
      <button class="btn btn-primary" id="saveBtn">保存当前分类卡片</button>
      <button class="btn btn-secondary" id="saveAllBtn">保存总排名卡片</button>
    </div>
  </div>
</div>

<div id="cardWrap"></div>

<script>
(function(){
  var DATA = window.__USERS__ || [];
  window.__DSH_RELOAD__ = function(){
    DATA = window.__USERS__ || [];
    if (window.__refreshRanks) window.__refreshRanks();
    if (window.__computeRanks) window.__computeRanks();
    if (typeof computeAllRanks === 'function' && RANK_MAPS && Object.keys(RANK_MAPS).length === 0){
      RANK_MAPS = computeAllRanks();
      window.RANK_MAPS = RANK_MAPS;
    }
    doSearch();
  };
  var ROW_H = 76;
  var OVERSCAN = 12;
  var sortMode = 'fan';
  var curUser = null;

  var listEl = document.getElementById('list');
  var spacerEl = document.getElementById('spacer');
  var winEl = document.getElementById('win');
  var barEl = document.getElementById('bar');
  var qEl = document.getElementById('q');
  var clrEl = document.getElementById('clr');
  var maskEl = document.getElementById('mask');
  var mbodyEl = document.getElementById('mbody');

  var view = [];
  var RANK_MAPS = {};
  var renderedFrom = -1, renderedTo = -1;

  function fmt(n){ return (n||0).toLocaleString('en-US'); }
  function esc(s){ return String(s||'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }

  var PERSONAL_IDS = new Set(["49088477", "64644201", "49613475", "65804232", "51971468", "22532586", "11874855", "19441452", "13388391", "15648281", "16022755", "9706054", "21228789", "56044871", "20810215", "14881317", "35015673", "56394847", "66835706", "13522750", "50113288", "9830519", "4464434", "13228840", "24571235", "32254552", "14422992", "22880628", "35755731", "12833243", "22738225", "57764648", "18139768"]);
  var SORT_LABEL = {fan:'粉丝', post:'发帖', follow:'关注', award:'点赞收藏', level:'等级', id:'ID'};
  var SORT_IDX = {fan:3, post:5, follow:4, award:7, level:6, id:1};

  
  /* ===== 多维度排名：为每条数据预计算各分类位次 =====
     字段索引: 0=粉丝排名 1=发帖排名 2=关注排名 3=点赞收藏排名 4=等级排名 5=ID排名
     rk[u][0..5] 存位次；u[9] 存原粉丝排名 */
  var RANK_KEYS = [
    { key: 'fan',    idx: 3, dir: -1 },
    { key: 'post',   idx: 5, dir: -1 },
    { key: 'follow', idx: 4, dir: -1 },
    { key: 'award',  idx: 7, dir: -1 },
    { key: 'level',  idx: 6, dir: -1 },
    { key: 'id',     idx: 1, dir:  1 }
  ];
  var RANK_OF = { fan:0, post:1, follow:2, award:3, level:4, id:5 };

  function computeAllRanks(){
    // rankMap[key] = { uid: rank }
    var maps = {};
    RANK_KEYS.forEach(function(k){
      var arr = DATA.slice();
      if (k.key === 'id'){
        arr.sort(function(a,b){
          var x = parseInt(a[1],10), y = parseInt(b[1],10);
          return x !== y ? x - y : a[0] - b[0];
        });
      } else {
        arr.sort(function(a,b){
          if (a[k.idx] !== b[k.idx]) return b[k.idx] - a[k.idx];
          return a[0] - b[0];
        });
      }
      var m = {};
      for (var i = 0; i < arr.length; i++) m[arr[i][1]] = i + 1;
      maps[k.key] = m;
    });
    return maps;
  }

  function rankIn(mode, u){
    var m = RANK_MAPS[mode];
    return m ? (m[u[1]] || 0) : 0;
  }

function applySort(arr){
    var key = SORT_IDX[sortMode];
    return arr.sort(function(a,b){
      if (sortMode === 'id'){
        var x = parseInt(a[1],10), y = parseInt(b[1],10);
        return x !== y ? x - y : a[0] - b[0];
      }
      if (a[key] !== b[key]) return b[key] - a[key];
      if (a[3] !== b[3]) return b[3] - a[3];
      return a[0] - b[0];
    });
  }

  /* 当前分类下该行应显示的数值与单位 */
  function curVal(u){
    var m = sortMode;
    if (m==='fan')    return [fmt(u[3]), '粉丝'];
    if (m==='award')  return [fmt(u[7]), '点赞收藏'];
    if (m==='level')  return ['Lv.'+u[6], '等级'];
    if (m==='post')   return [fmt(u[5]), '发帖'];
    if (m==='follow') return [fmt(u[4]), '关注'];
    return [u[1], 'ID'];
  }

  function rowHTML(u, displayRank){
    var rk = displayRank || u[0];
    var cls = 'row';
    if (rk===1) cls+=' top1';
    else if (rk<=3) cls+=' top2';
    else if (rk<=10) cls+=' top3';
    if (u[8]) cls+=' pin';
    var tg = u[8] ? '<span class="tag">个人</span>' : '';
    var cv = curVal(u);
    // 副信息：当前分类之外的两项
    var sub = [];
    if (sortMode!=='fan')    sub.push('粉丝 '+fmt(u[3]));
    if (sortMode!=='award')  sub.push('点赞收藏 '+fmt(u[7]));
    if (sortMode!=='post')   sub.push('发帖 '+fmt(u[5]));
    if (sortMode!=='follow') sub.push('关注 '+fmt(u[4]));
    var subHtml = sub.slice(0,3).map(function(s){ return '<span>'+s+'</span>'; }).join('');
    return '<div class="'+cls+'" data-i="'+u[0]+'" data-uid="'+esc(u[1])+'">'
      + '<div class="rk">'+rk+'</div>'
      + '<div class="mid"><div class="nm">'+tg+esc(u[2])+'</div>'
      + '<div class="stats">'+subHtml+'</div></div>'
      + '<div class="fan">'+cv[0]+'<span>'+cv[1]+'</span></div></div>';
  }

  function paint(force){
    if (!view.length){ winEl.innerHTML=''; renderedFrom=renderedTo=-1; return; }
    var st = listEl.scrollTop, h = listEl.clientHeight;
    var start = Math.max(0, Math.floor(st/ROW_H) - OVERSCAN);
    var end = Math.min(view.length, Math.ceil((st+h)/ROW_H) + OVERSCAN);
    if (!force && start===renderedFrom && end===renderedTo) return;
    renderedFrom=start; renderedTo=end;
    winEl.style.transform = 'translateY(' + (start*ROW_H) + 'px)';
    var parts=[];
    for (var i=start;i<end;i++) parts.push(rowHTML(view[i], i+1));
    winEl.innerHTML = parts.join('');
  }

  function setView(items){
    view = items;
    spacerEl.style.height = (items.length*ROW_H) + 'px';
    listEl.scrollTop = 0;
    renderedFrom = renderedTo = -1;
    if (items.length) paint(true); else winEl.innerHTML='';
  }

  function doSearch(){
    var kw = qEl.value.trim().toLowerCase();
    if (clrEl) clrEl.className = kw ? 'search-x on' : 'search-x';
    var items;
    if (!kw){
      items = DATA.slice();
      items = applySort(items);
      barEl.innerHTML = '共 <b>' + fmt(DATA.length) + '</b> 个账号 · 按' + SORT_LABEL[sortMode] + '排序';
    } else {
      items = [];
      for (var i=0;i<DATA.length;i++){
        var u = DATA[i];
        if (u[2].toLowerCase().indexOf(kw) > -1 || u[1].indexOf(kw) > -1) items.push(u);
      }
      items = applySort(items);
      barEl.innerHTML = '匹配 <b>' + fmt(items.length) + '</b> 个账号 · 按' + SORT_LABEL[sortMode] + '排序';
    }
    setView(items);
  }

  function openDetail(u){
    curUser = u;
    var mode = sortMode;
    var rk = rankIn(mode, u);
    var total = DATA.length;
    var modeName = SORT_LABEL[mode];

    document.getElementById('muser').innerHTML =
      '<div class="nm">'+esc(u[2])+(PERSONAL_IDS.has(u[1])?' <span class="tag" style="font-size:11px">个人</span>':'')+'</div>'
      + '<div class="uid">ID: '+esc(u[1])+'</div>';

    /* 6 格布局：[当前分类排名] [当前分类的值] [其余 4 项]
       —— 当前分类永远排在最左边（排名后面第一位） */
    var ALL = {
      fan:    [fmt(u[3]), '粉丝'],
      award:  [fmt(u[7]), '点赞收藏'],
      level:  ['Lv.'+u[6], '等级'],
      post:   [fmt(u[5]), '发帖'],
      follow: [fmt(u[4]), '关注'],
      id:     [String(u[1]), 'ID']
    };
    var cells = [[String(rk), modeName+'排名', true]];
    // 第二位：当前分类的值（高亮）
    cells.push([ALL[mode][0], ALL[mode][1], true]);
    // 其余分类，按固定顺序补齐到 6 格
    var order = ['fan','award','post','follow','level','id'];
    for (var oi=0; oi<order.length; oi++){
      var k = order[oi];
      if (k === mode) continue;
      cells.push([ALL[k][0], ALL[k][1], false]);
      if (cells.length >= 6) break;
    }
    var html = '';
    for (var i=0;i<cells.length;i++){
      var c = cells[i];
      html += '<div'+(c[2]?' class="hi"':'')+'><div class="v">'+c[0]+'</div><div class="k">'+c[1]+'</div></div>';
    }
    document.getElementById('mstats').innerHTML = html;

    // 排名相近：按当前分类排序后取前后 10
    var sorted = DATA.slice();
    var rkKey = RANK_KEYS[RANK_OF[mode]];
    if (mode === 'id'){
      sorted.sort(function(a,b){
        var x = parseInt(a[1],10), y = parseInt(b[1],10);
        return x !== y ? x - y : a[0] - b[0];
      });
    } else {
      sorted.sort(function(a,b){
        if (a[rkKey.idx] !== b[rkKey.idx]) return b[rkKey.idx] - a[rkKey.idx];
        return a[0] - b[0];
      });
    }
    var myIdx = rk - 1;
    var from = Math.max(0, myIdx-10), to = Math.min(sorted.length, myIdx+11);
    var h2 = '<div class="grp">'+modeName+'排名相近（#'+rk+' / '+fmt(total)+'）</div>';
    for (var j=from;j<to;j++){
      var x = sorted[j], isSelf = (x[1]===u[1]);
      var xrk = j+1;
      var val = mode==='fan' ? fmt(x[3]) : (mode==='award'? fmt(x[7]) : (mode==='post'? fmt(x[5]) : (mode==='follow'? fmt(x[4]) : (mode==='level'? 'Lv.'+x[6] : x[1]))));
      h2 += '<div class="mrow'+(isSelf?' self':'')+'" data-uid="'+esc(x[1])+'">'
        + '<div class="rk">'+xrk+'</div>'
        + '<div class="mid"><div class="nm">'+esc(x[2])+'</div></div>'
        + '<div class="fan">'+val+'</div></div>';
    }
    mbodyEl.innerHTML = h2;
    maskEl.classList.add('on');
    mbodyEl.scrollTop = 0;
    setTimeout(function(){
      var selfEl = mbodyEl.querySelector('.mrow.self');
      if (selfEl){
        var t = selfEl.offsetTop - mbodyEl.clientHeight/2 + selfEl.offsetHeight/2;
        mbodyEl.scrollTop = Math.max(0, t);
      }
    }, 20);
  }

/* ===== 生成卡片图片 =====
    mode: 'cat' = 当前分类排名卡片；'all' = 总排名（粉丝）卡片
*/
  function buildCard(u, mode, cb){
    if (!mode) mode = 'cat';
    var useMode = (mode === 'all') ? 'fan' : sortMode;
    var rk = rankIn(useMode, u);
    var total = DATA.length;
    var modeName = SORT_LABEL[useMode];

    // 当前分类的排序列表
    var sorted = DATA.slice();
    var rkKey = RANK_KEYS[RANK_OF[useMode]];
    if (useMode === 'id'){
      sorted.sort(function(a,b){
        var x = parseInt(a[1],10), y = parseInt(b[1],10);
        return x !== y ? x - y : a[0] - b[0];
      });
    } else {
      sorted.sort(function(a,b){
        if (a[rkKey.idx] !== b[rkKey.idx]) return b[rkKey.idx] - a[rkKey.idx];
        return a[0] - b[0];
      });
    }
    var myIdx = rk - 1;
    var from = Math.max(0, myIdx-10), to = Math.min(sorted.length, myIdx+11);
    var nearRows = [];
    for (var i=from;i<to;i++) nearRows.push({ d: sorted[i], r: i+1 });

    var W = 600;
    var TITLE_H = 46;
    var HEADER_H = 116;
    var STATS_H = 92;
    var GRP_H = 40;
    var ROW_H2 = 50;
    var PAD = 20;
    var H = TITLE_H + HEADER_H + STATS_H + GRP_H + ROW_H2*nearRows.length + 14;

    var dpr = 2;
    var cv = document.createElement('canvas');
    cv.width = W*dpr; cv.height = H*dpr;
    var x = cv.getContext('2d');
    x.scale(dpr, dpr);

    x.fillStyle='#ffffff'; x.fillRect(0,0,W,H);
    var FF = '-apple-system,"PingFang SC","Microsoft YaHei",sans-serif';

    // ===== 顶部色带：区分两种卡片 =====
    var bandColor = (mode === 'all') ? '#2c5f8e' : '#1a7f5a';
    x.fillStyle = bandColor;
    x.fillRect(0, 0, W, TITLE_H);
    x.fillStyle = '#ffffff';
    x.font = 'bold 15px ' + FF;
    x.textAlign = 'center';
    x.fillText(modeName + '排行榜', W/2, 30);
    x.textAlign = 'left';

    var Y0 = TITLE_H;

    // ===== 头部 =====
    x.fillStyle='#1a1a1a';
    var nm = u[2], fsz = 26;
    x.font = 'bold '+fsz+'px '+FF;
    while (x.measureText(nm).width > W-PAD*2 && fsz > 15){
      fsz -= 1; x.font = 'bold '+fsz+'px '+FF;
    }
    x.fillText(nm, PAD, Y0+44);

    x.textAlign='right';
    x.fillStyle='rgba(44,95,142,0.05)';
    x.font='bold 12px '+FF;
    x.fillText('化原', W-PAD, Y0+42);
    x.textAlign='left';

    x.fillStyle='#9aa0a6';
    x.font='13px '+FF;
    x.fillText('ID: '+u[1], PAD, Y0+72);

    x.strokeStyle='#eeeeee'; x.lineWidth=1;
    x.beginPath(); x.moveTo(0, Y0+HEADER_H-0.5); x.lineTo(W, Y0+HEADER_H-0.5); x.stroke();

    // ===== 数据区 =====
    // 分类卡片：第 1 格 = 当前分类排名，其余按分类顺序
    // 总排名卡片：6 格全部显示【各分类的排名】（不显示粉丝名次首格）
    var CLASS_ORDER = ['fan','award','post','follow','level','id'];
    var CLASS_NAME = { fan:'粉丝', award:'点赞收藏', post:'发帖', follow:'关注', level:'等级', id:'ID' };
    var CLASS_VAL = {
      fan:    fmt(u[3]),
      award:  fmt(u[7]),
      post:   fmt(u[5]),
      follow: fmt(u[4]),
      level:  'Lv.'+u[6],
      id:     String(u[1])
    };
    var stats;
    if (mode === 'all'){
      // 总排名卡片：六格 = 六个分类各自的排名
      stats = CLASS_ORDER.map(function(k){
        return [String(rankIn(k, u)), CLASS_NAME[k] + '排名'];
      });
    } else {
      // 分类卡片：首格 = 当前分类排名，第二格 = 当前分类的值，其余补齐
      stats = [[String(rk), modeName+'排名']];
      stats.push([CLASS_VAL[useMode], CLASS_NAME[useMode]]);
      for (var oi=0; oi<CLASS_ORDER.length; oi++){
        var k = CLASS_ORDER[oi];
        if (k === useMode) continue;
        stats.push([CLASS_VAL[k], CLASS_NAME[k]]);
        if (stats.length >= 6) break;
      }
    }
    var cellW = W/6;
    var sy = Y0 + HEADER_H;

    x.strokeStyle='#f0f1f3'; x.lineWidth=1;
    x.beginPath(); x.moveTo(0, sy+0.5); x.lineTo(W, sy+0.5); x.stroke();
    x.beginPath(); x.moveTo(0, sy+STATS_H-0.5); x.lineTo(W, sy+STATS_H-0.5); x.stroke();

    for (var i=0;i<stats.length;i++){
      var cxx = i*cellW;
      if (i>0){
        x.strokeStyle='#f0f1f3';
        x.beginPath(); x.moveTo(cxx+0.5, sy); x.lineTo(cxx+0.5, sy+STATS_H); x.stroke();
      }
      x.textAlign='center';
      x.fillStyle = (i===0) ? bandColor : '#2c5f8e';
      var vf = 20;
      x.font='bold '+vf+'px '+FF;
      var vt = stats[i][0];
      while (x.measureText(vt).width > cellW-10 && vf > 10){
        vf -= 1; x.font='bold '+vf+'px '+FF;
      }
      x.fillText(vt, cxx+cellW/2, sy+42);
      x.fillStyle='#9aa0a6';
      x.font='11px '+FF;
      x.fillText(stats[i][1], cxx+cellW/2, sy+66);
    }
    x.textAlign='left';

    // ===== 排名相近 =====
    var gy = sy + STATS_H;
    x.fillStyle='#fafbfc'; x.fillRect(0, gy, W, GRP_H);
    x.fillStyle='#9aa0a6'; x.font='12px '+FF;
    x.textBaseline='middle';
    var grpLabel = modeName + '排名相近（共 ' + fmt(total) + ' 个账号）';
    x.fillText(grpLabel, PAD, gy+GRP_H/2);
    x.textBaseline='alphabetic';

    var ry = gy + GRP_H;
    for (var j=0;j<nearRows.length;j++){
      var item = nearRows[j];
      var r = item.d;
      var isSelf = (r[1] === u[1]);
      var rowY = ry + j*ROW_H2;

      if (isSelf){
        x.fillStyle='#fff9e6'; x.fillRect(0, rowY, W, ROW_H2);
        x.fillStyle='#f0b400'; x.fillRect(0, rowY, 3, ROW_H2);
      }
      x.strokeStyle = j===nearRows.length-1 ? '#f0f1f3' : '#f7f8fa';
      x.lineWidth=1;
      x.beginPath(); x.moveTo(0, rowY+ROW_H2-0.5); x.lineTo(W, rowY+ROW_H2-0.5); x.stroke();

      var textY = rowY + ROW_H2/2 + 5;

      x.fillStyle = isSelf ? '#c07a00' : '#9aa0a6';
      x.font='bold 12px '+FF;
      x.textAlign='center';
      x.fillText(String(item.r), PAD+16, textY);
      x.textAlign='left';

      x.fillStyle='#1a1a1a';
      x.font=(isSelf?'bold ':'')+'14px '+FF;
      var rn = r[2];
      var maxW = W - PAD*2 - 32 - 110;
      while (x.measureText(rn).width > maxW && rn.length > 1){
        rn = rn.slice(0,-1);
      }
      if (rn !== r[2]) rn = rn.slice(0,-1)+'…';
      x.fillText(rn, PAD+46, textY);

      // 右侧显示当前分类对应的数值
      var showVal;
      if (useMode === 'fan') showVal = fmt(r[3]);
      else if (useMode === 'post') showVal = fmt(r[5]);
      else if (useMode === 'follow') showVal = fmt(r[4]);
      else if (useMode === 'award') showVal = fmt(r[7]);
      else if (useMode === 'level') showVal = 'Lv.'+r[6];
      else showVal = r[1];
      x.fillStyle= bandColor;
      x.font=(isSelf?'bold ':'')+'13px '+FF;
      x.textAlign='right';
      x.fillText(showVal, W-PAD, textY);
      x.textAlign='left';
    }

    cb(cv);
  }

  function format(n){ return (n||0).toLocaleString('en-US'); }

  function roundRect(ctx,x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
    ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
    ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
    ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y);
    ctx.closePath();
  }

  function saveCard(mode){
    if (!curUser) return;
    if (!mode) mode = 'cat';
    var btn = document.getElementById(mode==='all' ? 'saveAllBtn' : 'saveBtn');
    var old = btn.textContent;
    btn.textContent = '生成中…'; btn.disabled = true;

    buildCard(curUser, mode, function(cv){
      cv.toBlob(function(blob){
        var name = curUser[2].replace(/[\/:*?"<>|]/g,'_');
        var label = (mode==='all') ? '总排名' : (SORT_LABEL[sortMode] + '排名');
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url; a.download = '小黑盒_'+label+'_'+name+'.png';
        document.body.appendChild(a); a.click();
        document.body.removeChild(a);
        setTimeout(function(){ URL.revokeObjectURL(url); }, 1500);
        btn.disabled = false; btn.textContent = old;
      }, 'image/png');
    });
  }


  // 事件
  listEl.addEventListener('scroll', function(){ paint(false); }, { passive:true });
  window.addEventListener('resize', function(){ paint(true); });

  var sortBtns = document.querySelectorAll('#sorts button');
  for (var si=0; si<sortBtns.length; si++){
    (function(btn){
      btn.addEventListener('click', function(){
        for (var k=0;k<sortBtns.length;k++) sortBtns[k].className='';
        btn.className='on';
        sortMode = btn.getAttribute('data-sort');
        doSearch();
      });
    })(sortBtns[si]);
  }

  qEl.addEventListener('input', doSearch);
  if (clrEl) clrEl.addEventListener('click', function(){ qEl.value=''; doSearch(); qEl.focus(); });

  function findUser(uid){
    for (var i=0;i<DATA.length;i++){ if (DATA[i][1] === uid) return DATA[i]; }
    return null;
  }

  listEl.addEventListener('click', function(e){
    var row = e.target.closest('.row');
    if (!row) return;
    var uid = row.getAttribute('data-uid');
    var u = uid ? findUser(uid) : DATA[parseInt(row.getAttribute('data-i'),10)-1];
    if (u) openDetail(u);
  });
  mbodyEl.addEventListener('click', function(e){
    var row = e.target.closest('.mrow');
    if (!row) return;
    var uid = row.getAttribute('data-uid');
    var u = uid ? findUser(uid) : null;
    if (u) openDetail(u);
  });
  document.getElementById('mclose').addEventListener('click', function(){ maskEl.classList.remove('on'); });
  maskEl.addEventListener('click', function(e){ if (e.target===maskEl) maskEl.classList.remove('on'); });
  document.addEventListener('keydown', function(e){ if (e.key==='Escape') maskEl.classList.remove('on'); });
  document.getElementById('saveBtn').addEventListener('click', function(){ saveCard('cat'); });
  var sab = document.getElementById('saveAllBtn');
  if (sab) sab.addEventListener('click', function(){ saveCard('all'); });

  /* 数据就绪后计算各分类排名（数据由加载器异步填充，这里若为空则等 __DSH_RELOAD__ 回调） */
  function refreshRanks(){
    RANK_MAPS = computeAllRanks();
    window.RANK_MAPS = RANK_MAPS;
  }
  window.__refreshRanks = refreshRanks;
  window.__getUser = findUser;
  window.__buildCardTest = function(mode, cb){
    buildCard(curUser, mode, cb);
  };
  window.__setCurUser = function(u){ curUser = u; };
  refreshRanks();

  doSearch();
})();
</script>

<div id="__ld" style="position:fixed;inset:0;background:#f2f4f7;z-index:99998;display:flex;
flex-direction:column;align-items:center;justify-content:center;font-family:-apple-system,sans-serif">
  <div style="width:36px;height:36px;border:3px solid #d8e0e8;border-top-color:#2c5f8e;border-radius:50%;
       animation:__sp .8s linear infinite"></div>
  <div style="margin-top:14px;font-size:13px;color:#7a8a99" id="__ldt">正在加载排行数据…</div>
  <div style="margin-top:6px;font-size:12px;color:#a8b4c0" id="__ldp">0 / 12</div>
  <style>@keyframes __sp{to{transform:rotate(360deg)}}</style>
</div>

<script>
(function(){
  var T0 = performance.now();
  var ldEl = document.getElementById('__ld');
  var ldT = document.getElementById('__ldt');
  var ldP = document.getElementById('__ldp');

  /* 双域名并行：实测 gcore ~973 KB/s, testingcf ~963 KB/s */
  var BASES = [
    'https://gcore.jsdelivr.net/gh/cloudxys/heybox@55de7236204b/',
    'https://testingcf.jsdelivr.net/gh/cloudxys/heybox@55de7236204b/'
  ];
  var N = 12;
  var parts = new Array(N);
  var done = 0, fail = 0;
  var finished = false;

  function hideLoader(){
    if (!ldEl) return;
    ldEl.style.transition = 'opacity .25s';
    ldEl.style.opacity = '0';
    setTimeout(function(){ if (ldEl && ldEl.parentNode) ldEl.parentNode.removeChild(ldEl); }, 300);
  }

  function merge(){
    var all = [];
    for (var i = 0; i < N; i++){
      if (parts[i]) all = all.concat(parts[i]);
    }
    all.sort(function(a,b){ return a[0] - b[0]; });
    window.__USERS__ = all;
    if (window.__DSH_RELOAD__) window.__DSH_RELOAD__();
    return all.length;
  }

  function finish(){
    if (finished) return;
    finished = true;
    var el = (performance.now() - T0) / 1000;
    var n = window.__USERS__ ? window.__USERS__.length : 0;
    if (n >= 120000){
      hideLoader();
    } else {
      ldT.innerHTML = '⚠️ 加载了 ' + n.toLocaleString() + ' / 130,255 条<br>'
        + '<span style="font-size:12px;color:#d97706">部分数据加载失败，可刷新重试</span>';
      ldP.textContent = fail + ' 块失败';
      setTimeout(hideLoader, 2500);
    }
  }

  /* 12 块轮流分配到 2 个域名 → 每域名 6 并发 */
  function loadChunk(idx){
    var base = BASES[idx % 2];
    var url = base + 'e' + (idx + 1) + '.js';
    fetch(url, { cache: 'force-cache' })
      .then(function(r){
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(function(arr){
        if (arr && arr.length){
          parts[idx] = arr;
          done++;
          ldP.textContent = done + ' / ' + N;
          var n = merge();
          if (done + fail >= N) finish();
        } else {
          fail++;
          if (done + fail >= N) finish();
        }
      })
      .catch(function(){
        fail++;
        if (done + fail >= N) finish();
      });
  }

  for (var i = 0; i < N; i++) loadChunk(i);

  /* 兜底：8 秒还没加载完，先隐藏遮罩让用户能用已到的部分 */
  setTimeout(function(){
    if (!finished && done > 0) hideLoader();
  }, 8000);
})();
</script>
